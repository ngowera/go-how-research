name: gohow_research
description: GoHow Research - All-in-One University Research Software
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^18.0.1

  # Database (offline-first SQLite)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.2
  path: ^1.9.0

  # Supabase (cloud sync)
  supabase_flutter: ^2.3.4

  # Charts & Analytics
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^34.2.7

  # PDF & Export
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.2
  csv: ^8.0.0

  # UI & Icons
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0
  shimmer: ^4.0.0
  badges: ^3.1.2
  flex_color_scheme: ^8.4.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.20.3
  collection: ^1.18.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.2.2
  file_picker: ^12.3.0
  share_plus: ^13.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  image_picker: ^1.0.7
  permission_handler: ^13.0.2
  equatable: ^2.0.5
  logger: ^2.1.0
  dio: ^5.4.1
  record: 7.1.1
  audioplayers: 6.8.1
  table_calendar: ^3.0.9
  data_table_2: ^3.0.0
  reorderables: ^0.6.0
  dotted_border: ^3.1.0
  percent_indicator: ^4.2.3
  timeline_tile: ^2.0.0
  skeletonizer: ^3.0.0
  window_manager: ^0.5.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/lottie/
